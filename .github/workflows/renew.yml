name: Renew Library Books

on:
  schedule:
    - cron: '0 10 * * *' # 6 PM HKT (10 AM UTC)
  workflow_dispatch: # Allow manual trigger

jobs:
  renew:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run renewal script
        env:
          LIB_USERNAME: ${{ secrets.LIB_USERNAME }}
          LIB_PASSWORD: ${{ secrets.LIB_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          GMAIL_PWD: ${{ secrets.GMAIL_PWD }}
          # Additional accounts (optional)
          LIB_USERNAME2: ${{ secrets.LIB_USERNAME2 }}
          LIB_PASSWORD2: ${{ secrets.LIB_PASSWORD2 }}
          EMAIL_RECEIVER2: ${{ secrets.EMAIL_RECEIVER2 }}
          
        run: python hk_library_renew.py

      - name: Upload debug captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-captures-${{ github.run_number }}
          path: |
            error_page_*.html
            error_screenshot_*.png
            detail_page_*.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit borrow history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/ 2>/dev/null || echo "No history files yet"
          if git diff --cached --quiet; then
            echo "No borrow history changes to commit"
          else
            git commit -m "Update borrow history [skip ci]"
            git pull --rebase origin main
            git push
          fi

  publish-report:
    runs-on: ubuntu-latest
    needs: renew
    if: always()
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate rolling history report (last 12 months, all cards)
        run: |
          START=$(date -d "-1 year" +%Y.%m.%d)
          END=$(date +%Y.%m.%d)
          python history_report.py --from "$START" --to "$END" --mask-account \
            || echo "::warning::No borrow history available for report yet"

      - name: Upload report artifact
        if: hashFiles('reports/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: borrow-history-report-${{ github.run_number }}
          path: reports/
          retention-days: 90

      - name: Configure Pages
        if: hashFiles('reports/*') != ''
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: hashFiles('reports/*') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: Deploy to GitHub Pages
        id: deployment
        if: hashFiles('reports/*') != ''
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Email report link
        if: always() && hashFiles('reports/*') != ''
        env:
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          GMAIL_PWD: ${{ secrets.GMAIL_PWD }}
        run: python report_notify.py

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Borrowed History Report"
            echo ""
            if [ "${{ steps.deployment.outcome }}" = "success" ]; then
              echo "View online: ${{ steps.deployment.outputs.page_url }}"
            else
              echo "GitHub Pages is not enabled yet. Go to **Settings → Pages → Build and deployment → Source: GitHub Actions**, then re-run this workflow to get a direct view URL."
            fi
            echo "You can also download **borrow-history-report-${{ github.run_number }}** from the **Artifacts** section of this run page."
          } >> "$GITHUB_STEP_SUMMARY"
