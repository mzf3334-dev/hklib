name: Renew Library Books

on:
  schedule:
    - cron: '0 10 * * *' # 6 PM HKT (10 AM UTC)
  workflow_dispatch: # Allow manual trigger

jobs:
  renew:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run renewal script
        env:
          LIB_USERNAME: ${{ secrets.LIB_USERNAME }}
          LIB_PASSWORD: ${{ secrets.LIB_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          GMAIL_PWD: ${{ secrets.GMAIL_PWD }}
          # Additional accounts (optional)
          LIB_USERNAME2: ${{ secrets.LIB_USERNAME2 }}
          LIB_PASSWORD2: ${{ secrets.LIB_PASSWORD2 }}
          EMAIL_RECEIVER2: ${{ secrets.EMAIL_RECEIVER2 }}
          
        run: python hk_library_renew.py

      - name: Commit borrow history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/
          if git diff --cached --quiet; then
            echo "No borrow history changes to commit"
          else
            git commit -m "Update borrow history [skip ci]"
            git pull --rebase origin main
            git push
          fi
