name: Borrowed History Report

on:
  workflow_dispatch: # Run manually from the Actions tab
    inputs:
      start_date:
        description: 'Period start date, e.g. 2025.09.01 (leave both dates blank for the last 12 months)'
        required: false
        default: ''
      end_date:
        description: 'Period end date, e.g. 2026.08.31'
        required: false
        default: ''
      account:
        description: 'Library card number (leave blank to generate the report for all cards)'
        required: false
        default: ''

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate borrowed history report
        env:
          INPUT_START: ${{ github.event.inputs.start_date }}
          INPUT_END: ${{ github.event.inputs.end_date }}
          INPUT_ACCOUNT: ${{ github.event.inputs.account }}
        run: |
          args=(--mask-account)
          if [ -z "$INPUT_START" ] && [ -z "$INPUT_END" ]; then
            START=$(date -d "-1 year" +%Y.%m.%d)
            END=$(date +%Y.%m.%d)
            echo "No dates given, defaulting to $START - $END"
            args+=(--from "$START" --to "$END")
          elif [ -z "$INPUT_START" ] || [ -z "$INPUT_END" ]; then
            echo "::error::Fill in BOTH period start and period end dates (or leave both blank for the last 12 months)."
            exit 1
          else
            args+=(--from "$INPUT_START" --to "$INPUT_END")
          fi
          if [ -n "$INPUT_ACCOUNT" ]; then
            args+=(--account "$INPUT_ACCOUNT")
          fi
          python history_report.py "${args[@]}"

      - name: Upload report for download
        uses: actions/upload-artifact@v4
        with:
          name: borrowed-history-report-${{ github.run_number }}
          path: reports/
          if-no-files-found: error
          retention-days: 90

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Borrowed History Report"
            echo ""
            if [ "${{ steps.deployment.outcome }}" = "success" ]; then
              echo "View online: ${{ steps.deployment.outputs.page_url }}"
            else
              echo "GitHub Pages is not enabled yet. Go to **Settings → Pages → Build and deployment → Source: GitHub Actions**, then re-run this workflow to get a direct view URL."
            fi
            echo "You can also download **borrowed-history-report-${{ github.run_number }}** from the **Artifacts** section of this run page, unzip it, open the HTML file in a browser and print to A4 (Ctrl+P / Cmd+P)."
          } >> "$GITHUB_STEP_SUMMARY"
